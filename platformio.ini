; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
lib_deps =
    madhephaestus/ESP32Servo
monitor_speed = 115200
build_src_filter =
    +<*>
    -<servo_test/>

; Standalone bench test for a single MG90S servo (src/servo_test/main.cpp).
; No Bluepad32/controller dependency needed here, so this skips the
; platform_packages override the main env uses and stays on plain Arduino.
[env:servo_test]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo
monitor_speed = 115200
build_src_filter =
    -<*>
    +<servo_test/*>
