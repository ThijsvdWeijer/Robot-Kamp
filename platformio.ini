; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
lib_deps =
    madhephaestus/ESP32Servo
monitor_speed = 115200
; Excludes the standalone servo_test/ tool below so its setup()/loop() don't
; clash with the real firmware's.
build_src_filter = +<*> -<servo_test/>

; Standalone per-servo button jog test, not part of the real firmware.
; See src/servo_test/main.cpp. Build/upload/monitor with:
;   pio run -e servo_test -t upload -t monitor
; (PlatformIO 6.x only supports a single src_dir per project, so this tool
; lives under src/ and is selected in isolation via build_src_filter rather
; than a separate src_dir.)
[env:servo_test]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
lib_deps =
    madhephaestus/ESP32Servo
monitor_speed = 115200
build_src_filter = -<*> +<servo_test/>
